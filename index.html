<!doctype html>
<html lang="en" class="dark"> <!-- ajoute ou supprime 'dark' pour tester le mode sombre -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/public/logo.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <title>BankRewmi</title>
</head>

<body class="min-h-screen bg-white dark:bg-gray-900 text-black dark:text-white transition-colors duration-300">
  
  <!-- Toggle Mode Sombre / Clair -->
  <div class="flex justify-end p-4">
    <button id="theme-toggle" class="px-4 py-2 rounded bg-[#cbb99a] dark:bg-[#6b5a49] text-white font-semibold shadow-lg">
      Mode Sombre / Clair
    </button>
  </div>

  <!-- Exemple de contenu -->
  <div class="p-6 m-6 bg-[#f3e8d7] dark:bg-neutral-800 rounded-xl shadow-lg transition-colors duration-300">
    <h1 class="text-2xl font-bold text-[#6b5a49] dark:text-[#f3e8d7] mb-4">Bonjour, utilisateur !</h1>
    <p class="text-[#6b5a49] dark:text-[#d8cbb4]">
      Bienvenue dans votre application bancaire.
    </p>
  </div>

  <div id="root"></div>

  <script>
    const toggle = document.getElementById('theme-toggle');
    toggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });
  </script>

</body>
</html>
